[project]
name = "ai-intuition"
version = "0.1.0"
description = "Repo-first AI intuition compiler"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "feedparser>=6.0.11",
  "httpx>=0.27.2",
  "pydantic>=2.9.2",
  "python-frontmatter>=1.1.0",
  "pyyaml>=6.0.2",
  "rich>=13.8.1",
  "typer>=0.12.5",
]

[project.scripts]
aic = "app.cli:app"
aios = "app.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
